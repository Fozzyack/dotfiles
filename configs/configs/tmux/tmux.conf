# True color inside Ghostty and other compatible terminals.
set -g default-terminal 'tmux-256color'
set-option -ga terminal-overrides ",xterm-256color:Tc"
set-option -ga terminal-features ',xterm-ghostty:RGB'

set -g prefix C-s
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g set-clipboard on
set -g allow-passthrough on

set-window-option -g mode-keys vi

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Used with tmux start-server
# Starts the server with 0 sessions and keeps running even if there are no sessions available
# Prevents Cold launching every time tmux is started up
# Power user utility :)
set -g exit-empty off

# Plugins: Ctrl+s I installs, Ctrl+s U updates, Ctrl+s Alt+u cleans unused.
# Appearance is native tmux; no theme or status-metric plugins are needed.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-logging'

# Sensible Things
set -g history-limit 4096
set -s escape-time 0

# Initialize installed plugins before applying the theme. Support both TPM paths.
run-shell 'if [ -f "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/plugins/tpm/tpm" ]; then \
    "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/plugins/tpm/tpm"; \
    elif [ -f "$HOME/.tmux/plugins/tpm/tpm" ]; then "$HOME/.tmux/plugins/tpm/tpm"; fi'

# RETRO DARK — palette from configs/configs/ghostty/themes/retro-dark.
# Charcoal #040607 / cream #e8d3a2 / orange #ff851b / teal #66b2a5.
# Default backgrounds let Ghostty's charcoal glass show through between blocks.
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style 'fg=#e8d3a2,bg=default,none'
set -g status-left-style 'fg=#e8d3a2,bg=default,none'
set -g status-right-style 'fg=#e8d3a2,bg=default,none'
set -g status-left-length 26
set -g status-right-length 70

# Squared-off console labels; no Powerline glyphs or external status scripts.
set -g status-left '#[fg=#040607,bg=#66b2a5,bold] [ #{=18:session_name} ] #[default] '
set -g status-right '#{?client_prefix,#[fg=#040607 bg=#ff851b bold] KEY #[default] ,}#{?pane_in_mode,#[fg=#fff0c7 bg=#315653 bold] COPY #[default] ,}#{?window_zoomed_flag,#[fg=#66b2a5] [ZOOM] ,}#{?#{>=:#{client_width},100},#[fg=#64736e]#{=18:host_short} / ,}#{?#{>=:#{client_width},120},#[fg=#e8d3a2]%d %b ,}#[fg=#040607,bg=#ff851b,bold] %H:%M #[default]'

set -g window-status-separator ' '
set -g window-status-style 'fg=#e8d3a2,bg=#202829,none'
set -g window-status-last-style 'fg=#66b2a5,bg=#202829,none'
set -g window-status-activity-style 'fg=#86d1bf,bg=#315653,bold'
set -g window-status-bell-style 'fg=#040607,bg=#cf6b56,bold'
set -g window-status-format ' #I : #{=20:window_name}#F '
set -g window-status-current-style 'fg=#040607,bg=#ff851b,bold'
set -g window-status-current-format ' > #I : #{=20:window_name}#F '

# Thin teal dividers and phosphor-colored pane numbers.
set -g pane-border-lines single
set -g pane-border-style 'fg=#202829,bg=default'
set -g pane-active-border-style 'fg=#66b2a5,bg=default'
set -g display-panes-colour '#64736e'
set -g display-panes-active-colour '#ff851b'
set -g clock-mode-colour '#ff851b'
set -g clock-mode-style 24

# Match Ghostty's selection colors in copy mode, prompts, menus, and popups.
set -g mode-style 'fg=#fff0c7,bg=#315653'
set -g message-style 'fg=#e8d3a2,bg=#202829'
set -g message-command-style 'fg=#ff851b,bg=#202829'
set -g menu-style 'fg=#e8d3a2,bg=#040607'
set -g menu-selected-style 'fg=#040607,bg=#ff851b,bold'
set -g menu-border-style 'fg=#66b2a5,bg=default'
set -g menu-border-lines single
set -g popup-style 'fg=#e8d3a2,bg=#040607'
set -g popup-border-style 'fg=#66b2a5,bg=default'
set -g popup-border-lines single
