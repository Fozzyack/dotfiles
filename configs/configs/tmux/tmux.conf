# True color inside Ghostty and other compatible terminals.
set -g default-terminal 'tmux-256color'
set-option -ga terminal-overrides ",xterm-256color:Tc"
set-option -ga terminal-features ',xterm-ghostty:RGB'

set -g prefix C-s
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g set-clipboard on
set -g allow-passthrough on

set-window-option -g mode-keys vi

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Used with tmux start-server
# Starts the server with 0 sessions and keeps running even if there are no sessions available
# Prevents Cold launching every time tmux is started up
# Power user utility :)
set -g exit-empty off

# Plugins: Ctrl+s I installs, Ctrl+s U updates, Ctrl+s Alt+u cleans unused.
# Appearance is native tmux; no theme or status-metric plugins are needed.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-logging'

# Sensible Things
set -g history-limit 4096
set -s escape-time 0

# Initialize installed plugins before applying the theme. Support both TPM paths.
run-shell 'if [ -f "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/plugins/tpm/tpm" ]; then \
    "${XDG_CONFIG_HOME:-$HOME/.config}/tmux/plugins/tpm/tpm"; \
    elif [ -f "$HOME/.tmux/plugins/tpm/tpm" ]; then "$HOME/.tmux/plugins/tpm/tpm"; fi'

# Load appearance from beside this config, independent of the working directory.
source-file -F '#{d:current_file}/theme.conf'
