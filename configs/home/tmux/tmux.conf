set-option -ga terminal-overrides ",xterm-256color:Tc"
#
# FOR TMUX PLUGINS
# tmux source ~/.tmux.conf
# Ctrl+s I   # Install plugins (capital I)
# Ctrl+s U   # Update all plugins
# Ctrl+s alt+u   # Remove unused plugins
# 
# unbind r
# 
# bind r source-file ~/.config/tmux/tmux.conf
# 


set -g prefix C-s
set -g mouse on
set -g base-index 1 
set -g pane-base-index 1 
set -g set-clipboard on
set -g allow-passthrough on

set-window-option -g mode-keys vi

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Used with tmux start-server
# Starts the server with 0 sessions and keeps running even if there are no sessions available
# Prevents Cold launching every time tmux is started up
# Power user utility :)
set -g exit-empty off


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# Sensible Things
set -g history-limit 4096
set -s escape-time 0
set -g status-interval 10
## THEME: retro dark, matching configs/wezterm.lua
set -g @plugin 'wfxr/tmux-power'
set -g @tmux_power_theme '#ff851b' # accent
set -g @tmux_power_g0 '#060909'    # mantle / status background
set -g @tmux_power_g1 '#090d0e'    # base
set -g @tmux_power_g2 '#2b3e3e'    # surface / inactive segments
set -g @tmux_power_g3 '#7c8b85'    # muted
set -g @tmux_power_g4 '#e5d5b7'    # text
set -g @tmux_power_show_user    true
set -g @tmux_power_show_host    true
set -g @tmux_power_show_session true
set -g @tmux_power_time_format '%H:%M'

# Initialize plugins before the final theme overrides below.
run '~/.tmux/plugins/tpm/tpm'

# tmux-power sets these itself; apply WezTerm-specific styling after it loads.
# Leave pane backgrounds alone so WezTerm retains its colors and transparency.
set -g pane-border-style 'fg=#2b3e3e,bg=default'
set -g pane-active-border-style 'fg=#66b2a5,bg=default'
set -g display-panes-colour '#7c8b85'
set -g display-panes-active-colour '#66b2a5'
set -g window-status-format '#[fg=#060909,bg=#2b3e3e]#[fg=#7c8b85,bg=#2b3e3e] #I:#W#F #[fg=#2b3e3e,bg=#060909]'
set -g window-status-activity-style 'fg=#66b2a5,bg=#060909,bold'
set -g mode-style 'fg=#fff0d5,bg=#315653'
set -g message-style 'fg=#e5d5b7,bg=#2b3e3e'
set -g message-command-style 'fg=#ff851b,bg=#2b3e3e'



