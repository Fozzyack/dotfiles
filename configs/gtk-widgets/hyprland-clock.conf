# Legacy Hyprlang rules (0.53/0.54 syntax). For Lua use hyprland-widgets.lua.
windowrule {
    name = retro-widgets
    match:class = ^(com\.example\.Retro(Clock|Calendar|Weather|System))$
    float = on
    pin = on
    border_size = 0
    rounding = 0
    no_shadow = on
    opacity = 1.0 override 1.0 override
}

windowrule {
    name = retro-clock-position
    match:class = ^(com\.example\.RetroClock)$
    move = 30 60
}
windowrule {
    name = retro-calendar-position
    match:class = ^(com\.example\.RetroCalendar)$
    move = 30 300
}
windowrule {
    name = retro-weather-position
    match:class = ^(com\.example\.RetroWeather)$
    move = 430 60
}
windowrule {
    name = retro-system-position
    match:class = ^(com\.example\.RetroSystem)$
    move = 830 60
}
